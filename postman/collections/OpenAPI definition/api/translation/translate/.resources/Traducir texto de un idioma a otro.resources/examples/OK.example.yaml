$kind: http-example
request:
  url: "{{baseUrl}}/api/translation/translate"
  method: POST
  headers:
    Content-Type: application/json
    Accept: "*/*"
  body:
    type: json
    content: |-
      {
        "text": "string",
        "sourceLanguage": "string",
        "targetLanguage": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: "{}"
order: 1000
