<nav id="navbar" class="admin-nav">
  <div class="container nav-container">
    <a routerLink="/" class="logo">
      <img id="nav-logo" src="/images/Mira Mar logo.png" alt="Mira Mar logo" width="120" />
    </a>
    <ul class="nav-links">
      <li class="profile-dropdown-item profile-dropdown-item--menu">
        <details class="profile-actions-menu navbar-user-menu" style="list-style: none;">
          <summary class="profile-actions-menu__trigger user-login-link" aria-label="Opciones de sesión">
            <img id="nav-user-icon" src="/images/usuarioNegro.png" alt="Foto de perfil" class="profile-img" />
          </summary>
          <div class="profile-actions-menu__panel">
            <button type="button" class="profile-actions-menu__item profile-actions-menu__item--danger" (click)="logout()">
              <i class="ph ph-sign-out"></i>
              Cerrar sesión
            </button>
          </div>
        </details>
      </li>
    </ul>
    <div class="hamburger">
      <i class="ph ph-list"></i>
    </div>
  </div>
</nav>

<main class="admin-dashboard container">
  <div class="section-header">
    <span>Panel de Control</span>
    <h2>Gestión Operativa</h2>
  </div>

  <div class="admin-grid">
    <a class="admin-card" routerLink="/reservations">
      <i class="ph ph-calendar-check main-icon"></i>
      <h3>Reservas</h3>
    </a>

    <a class="admin-card" routerLink="/usuarios">
      <i class="ph ph-users main-icon"></i>
      <h3>Clientes</h3>
    </a>

    <a class="admin-card" href="javascript:void(0)">
      <i class="ph ph-receipt main-icon"></i>
      <h3>Cuentas/Check-out</h3>
    </a>
  </div>
</main>
