<div class="container">
  <div class="row justify-content-center">
    <div class="col-12 col-sm-9 col-md-7 col-lg-4 text-center">

      <div class="contenedor-logo">
        <img src="/images/Mira Mar logo.png" alt="Logotipo Mira Mar" class="logo-principal img-fluid">
      </div>

      <div class="card auth-card tarjeta-transparente">
        <div class="card-body p-4 p-md-5">

          <form (submit)="$event.preventDefault(); onLogin()">

            <div *ngIf="errorMessage" class="error-banner">
              {{ errorMessage }}
            </div>

            <div class="mb-3 text-start">
              <label for="usuario" class="form-label text-dark fw-bold">Usuario</label>
              <input type="text" class="form-control form-control-lg"
                     id="usuario" name="username" placeholder="Usuario" required
                     [(ngModel)]="username">
            </div>

            <div class="mb-4 text-start">
              <label for="password" class="form-label text-dark fw-bold">Contraseña</label>
              <input type="password" class="form-control form-control-lg"
                     id="password" name="password" placeholder="******" required
                     [(ngModel)]="password">
            </div>

            <div class="text-center mb-4">
               <a href="#" class="text-dark small text-decoration-none border-bottom">
                ¿Has olvidado tu contraseña?
              </a>
            </div>

            <div class="d-grid gap-3">
              <button type="submit" class="btn btn--primary btn-lg boton-primario" [disabled]="loading">
                {{ loading ? 'Entrando...' : 'Entrar' }}
              </button>
              <a routerLink="/create-account" class="btn btn--ghost btn-lg boton-primario text-center" role="button">
                Crear una cuenta
              </a>
            </div>
          </form>

        </div>
      </div>

      <p class="mt-4 text-dark small">© 2026 Mira Mar - Todos los derechos reservados</p>
    </div>
  </div>
</div>
