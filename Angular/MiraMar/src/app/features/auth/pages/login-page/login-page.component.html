<main class="auth-page page-services">
  <div class="container">
    <div class="auth-card">
      <div class="auth-card__header">
        <h1>Iniciar Sesión</h1>
        <p>Bienvenido de vuelta a Mira Mar</p>
      </div>

      <div class="auth-card__error" *ngIf="errorMessage">
        <i class="ph ph-warning-circle"></i>
        {{ errorMessage }}
      </div>

      <form (ngSubmit)="login()" class="auth-form">
        <div class="form-field">
          <label for="username">Usuario</label>
          <input
            type="text"
            id="username"
            name="username"
            [(ngModel)]="credentials.username"
            placeholder="Tu nombre de usuario"
            required
          />
        </div>

        <div class="form-field">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="credentials.password"
            placeholder="Tu contraseña"
            required
          />
        </div>

        <button type="submit" class="btn btn--primary auth-btn" [disabled]="loading">
          {{ loading ? 'Ingresando...' : 'Ingresar' }}
        </button>
      </form>

      <div class="auth-card__footer">
        <p>¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a></p>
      </div>
    </div>
  </div>
</main>
