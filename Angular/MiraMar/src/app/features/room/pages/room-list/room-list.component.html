<main class="services-page page-services">
  <div class="container">
    <section class="services-page__sectionHeader">
      <div>
        <h2>Habitaciones</h2>
        <p>Gestión de habitaciones del hotel.</p>
      </div>
      <div class="services-page__sectionActions">
        <a routerLink="/admin" class="btn btn--ghost">Volver al panel</a>
      </div>
    </section>

    <p *ngIf="warningMessage" class="warning-text">{{ warningMessage }}</p>

    <table class="services-table" *ngIf="rooms.length > 0">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Tipo</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let room of rooms">
          <td>{{ room.id }}</td>
          <td>{{ room.nombre }}</td>
          <td>{{ room.tipoHabitacion?.nombre || '—' }}</td>
          <td>
            <div class="icon-actions">
              <button
                type="button"
                class="icon-action icon-action--danger"
                title="Eliminar"
                (click)="deleteRoom(room)"
              >
                <i class="ph ph-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <section *ngIf="rooms.length === 0" class="services-page__empty" aria-live="polite">
      <h2>No hay habitaciones</h2>
      <p>Las habitaciones se crean desde el sistema.</p>
    </section>
  </div>
</main>
