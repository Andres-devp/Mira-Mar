<nav
  id="navbar"
  [class.scrolled]="applyScrolledStyle"
  [class.nav-open]="isNavOpen"
  [class.roomtypes-nav]="usesSolidTheme"
>
  <div class="container nav-container">
    <a routerLink="/" class="logo" (click)="closeMenu()">
      <img id="nav-logo" [src]="logoPath" alt="Mira Mar logo" width="120" />
    </a>

    <ul class="nav-links">
      <li><a routerLink="/" (click)="closeMenu()">Inicio</a></li>
      <li><a routerLink="/rooms" (click)="closeMenu()">Suites</a></li>
      <li><a routerLink="/services" (click)="closeMenu()">Servicios</a></li>
      <li>
        <a
          routerLink="/rooms"
          fragment="suites"
          class="book-btn-nav"
          (click)="closeMenu()"
          >Reservar</a
        >
      </li>
      <li class="profile-dropdown-item" *ngIf="!isAuthenticated">
        <a routerLink="/login" class="user-login-link" (click)="closeMenu()">
          <img
            id="nav-user-icon"
            [src]="userIconPath"
            alt="Icono de usuario"
            class="profile-img"
          />
        </a>
      </li>
      <li
        class="profile-dropdown-item profile-dropdown-item--menu"
        *ngIf="isAuthenticated"
      >
        <details 
          class="profile-actions-menu navbar-user-menu"
          (toggle)="isUserMenuOpen = $any($event.target).open"
        >
          <summary
            class="profile-actions-menu__trigger user-login-link"
            aria-label="Opciones de sesión"
          >
            <img
              [src]="userIconPath"
              alt="Icono de usuario"
              class="profile-img"
            />
          </summary>
          <div class="profile-actions-menu__panel">
            <a
              [routerLink]="profileRoute"
              class="profile-actions-menu__item"
              (click)="closeMenu()"
            >
              <i class="ph ph-user-circle"></i>
              Perfil
            </a>
            <button
              type="button"
              class="profile-actions-menu__item profile-actions-menu__item--danger"
              (click)="logout()"
            >
              <i class="ph ph-sign-out"></i>
              Cerrar sesión
            </button>
          </div>
        </details>
      </li>
    </ul>

    <div class="hamburger" (click)="toggleMenu()">
      <i class="ph ph-list"></i>
    </div>
  </div>
</nav>
