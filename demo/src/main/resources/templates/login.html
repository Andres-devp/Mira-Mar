<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Mira Mar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background: url('/images/FondoLogin.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .tarjeta-transparente {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
        }

        .logo-principal {
            max-width: 220px;
            margin-bottom: 25px;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.1));
        }

        .entrada-texto {
            
            background: rgba(255, 255, 255, 0.9) !important;
            border: none;
            border-radius: 10px;
            padding: 12px 15px;
        }

        .boton-primario {
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .boton-primario:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-9 col-md-7 col-lg-4 text-center">
            
            <div class="contenedor-logo">
                <img src="/images/Mira Mar logo.png" alt="Logotipo Mira Mar" class="logo-principal img-fluid">
            </div>

            <div class="card tarjeta-transparente shadow-lg">
                <div class="card-body p-4 p-md-5">
                    
                    <form th:action="@{/login}" method="post">
                        <div th:if="${error}" class="alert alert-danger" role="alert" th:text="${error}"></div>
                        <div class="mb-3 text-start">
                            <label for="usuario" class="form-label text-dark fw-bold">Usuario</label>
                            <input type="text" class="form-control form-control-lg entrada-texto shadow-sm" 
                                   id="usuario" name="username" placeholder="Usuario" required>
                        </div>
                        
                        <div class="mb-4 text-start">
                            <label for="password" class="form-label text-dark fw-bold">Contraseña</label>
                            <input type="password" class="form-control form-control-lg entrada-texto shadow-sm" 
                                   id="password" name="password" placeholder="******" required>
                        </div>

                        <div class="text-center mb-4">
                            <a href="#" class="text-dark small text-decoration-none border-bottom border-dark">
                                ¿Has olvidado tu contraseña?
                            </a>
                        </div>
                        
                        <div class="d-grid gap-3">
                            <button type="submit" class="btn btn-primary btn-lg boton-primario shadow">
                                Entrar
                            </button>
                            <button type="button" class="btn btn-outline-dark btn-lg boton-primario">
                                Crear una cuenta
                            </button>
                        </div>
                    </form>
                    
                </div>
            </div>

            <p class="mt-4 text-dark small">© 2026 Mira Mar - Todos los derechos reservados</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
