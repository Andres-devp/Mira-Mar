<div th:fragment="navbar">
      <nav id="navbar">
        <div class="container nav-container">
          <a href="/" class="logo">
            <img
              id="nav-logo"
              src="/images/Mira Mar logo Blanco.png"
              alt="Mira Mar logo"
              width="120"
              data-default="/images/Mira Mar logo Blanco.png"
              data-scrolled="/images/Mira Mar logo.png"
            />
          </a>
          <ul class="nav-links">
            <li><a href="/">Inicio</a></li>
            <li><a href="/rooms">Suites</a></li>
            <li><a href="/services/cards">Servicios</a></li>
            <li><a href="/usuarios" class="active">Usuarios</a></li>
            <li><a href="/#contact">Contacto</a></li>
            <li th:if="${session.loggedUser == null}"><a href="/login" class="book-btn-nav">Login</a></li>
            <!-- Perfil del usuario autenticado -->
            <li th:if="${session.loggedUser != null}" class="profile-dropdown-item">
              <button class="profile-btn" type="button" id="profileBtn">
                <!-- Foto de perfil del usuario -->
                <img th:if="${session.loggedUser.fotoPerfil}" 
                    th:src="'/' + ${session.loggedUser.fotoPerfil}" 
                    alt="Foto de perfil"
                    class="profile-img"/>
                <!-- Icono genérico si no tiene foto de perfil -->
                <i th:unless="${session.loggedUser.fotoPerfil}" class="ph ph-user-circle profile-icon"></i> 
              </button>
              <!-- Dropdown menu -->
              <div class="profile-dropdown" id="profileDropdown">
                <a href="/profile" class="dropdown-item">Ver Perfil</a>
                <hr class="dropdown-divider" />
                <a href="/logout" class="dropdown-item logout-item">Logout</a>
              </div>
            </li>
          </ul>
          <div class="hamburger">
            <i class="ph ph-list"></i>
          </div>
        </div>
      </nav>
    </div>
