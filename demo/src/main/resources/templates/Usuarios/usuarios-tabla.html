<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Usuarios (Tabla) | Mira Mar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/Usuarios/usuarios-tabla.css" />
  </head>
  <body class="page-services">
    <div th:replace="fragments/navbar :: navbar"></div>

    <main class="services-page">
      <div class="container">
        <header class="services-page__header">
          <h1>Usuarios (Tabla)</h1>
          <p>Vista administrativa/rápida.</p>

          <div class="services-page__actions">
            <!-- same structure as servicios table but adapted -->
            <a href="/usuarios/add" class="btn btn--primary">Crear usuario</a>
          </div>
        </header>

        <table class="services-table" th:if="${not #lists.isEmpty(usuarios)}">
          <thead>
            <tr>
              <th>ID</th>
              <th>Usuario</th>
              <th>Rol</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="usuario : ${usuarios}">
              <td th:text="${usuario.id}"></td>
              <td th:text="${usuario.usuario}"></td>
              <td th:text="${usuario.rol}"></td>
              <td>
                <div class="services-table__actions">
                  <a
                    th:href="@{'/usuarios/' + ${usuario.id}}"
                    class="btn btn--ghost btn--full"
                    >Ver</a
                  >
                  <div class="services-table__actions-row">
                    <a
                      th:href="@{'/usuarios/edit/' + ${usuario.id}}"
                      class="btn btn--ghost"
                      >Editar</a
                    >
                    <form
                      th:action="@{'/usuarios/delete/' + ${usuario.id}}"
                      method="post"
                    >
                      <button
                        type="submit"
                        class="btn btn--secondary"
                        onclick="
                          return confirm(
                            '¿Seguro que deseas eliminar este usuario?',
                          );
                        "
                      >
                        Eliminar
                      </button>
                    </form>
                  </div>
                </div>
              </td>
            </tr>
          </tbody>
        </table>

        <section
          th:if="${#lists.isEmpty(usuarios)}"
          class="services-page__empty"
          aria-live="polite"
        >
          <h2>No hay usuarios disponibles</h2>
          <p>Crea un usuario para verlo aquí.</p>
        </section>
      </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>

    <script src="/js/script.js"></script>
  </body>
</html>
