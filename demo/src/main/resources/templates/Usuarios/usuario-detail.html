<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil de Usuario | Mira Mar</title>
    <link rel="icon" type="image/png" href="/images/Mira Mar logo Blanco.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/Usuarios/usuario-detail.css" />
  </head>
  <body class="detail-page">

    <div th:replace="fragments/navbar :: navbar"></div>

    <header class="detail-hero">
      <div class="container">
        <div class="detail-hero__grid">
          <div>
            <h1 class="detail-hero__title" th:text="${usuario.nombre}">Nombre</h1>
            <p class="detail-hero__lead">
              <i class="ph ph-user-circle"></i>
              <span th:text="${usuario.usuario}">@usuario</span>
              &nbsp;&bull;&nbsp;
              <span class="detail-hero__role-badge" th:text="${usuario.rol}">Rol</span>
            </p>
            <div class="detail-hero__actions">
              <a href="/usuarios" class="btn btn--ghost">&larr; Volver</a>
              <a th:href="@{'/usuarios/edit/' + ${usuario.id}}" class="btn btn--primary">
                <i class="ph ph-pencil-simple"></i> Editar perfil
              </a>
              <form th:action="@{'/usuarios/delete/' + ${usuario.id}}" method="post" style="display:inline">
                <button type="submit" class="btn btn--secondary"
                        onclick="return confirm('Seguro que deseas eliminar este usuario?')">
                  <i class="ph ph-trash"></i> Eliminar
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="detail-main">
      <div class="container">

        <div class="profile-layout">

          <!-- Left: Avatar + quick info -->
          <aside class="profile-sidebar">
            <div class="profile-avatar-wrap">
              <div class="profile-avatar">
                <i class="ph ph-user"></i>
              </div>
            </div>
            <div class="profile-sidebar__info">
              <p class="profile-sidebar__name" th:text="${usuario.nombre}"></p>
              <p class="profile-sidebar__username" th:text="'@' + ${usuario.usuario}"></p>
              <span class="profile-sidebar__badge" th:text="${usuario.rol}"></span>
            </div>
            <div class="profile-sidebar__actions">
              <a th:href="@{'/usuarios/edit/' + ${usuario.id}}" class="btn btn--primary" style="width:100%">
                <i class="ph ph-pencil-simple"></i> Editar perfil
              </a>
              <form th:action="@{'/usuarios/delete/' + ${usuario.id}}" method="post">
                <button type="submit" class="btn btn--secondary" style="width:100%"
                        onclick="return confirm('Seguro que deseas eliminar este usuario?')">
                  <i class="ph ph-trash"></i> Eliminar cuenta
                </button>
              </form>
            </div>
          </aside>

          <!-- Right: Detail sections -->
          <div class="profile-content">

            <section class="detail-section">
              <h2 class="detail-section__title">Informaci�n personal</h2>
              <div class="profile-info-grid">
                <div class="profile-info-item">
                  <span class="profile-info-item__icon"><i class="ph ph-identification-card"></i></span>
                  <div>
                    <p class="profile-info-item__label">Nombre completo</p>
                    <p class="profile-info-item__value" th:text="${usuario.nombre}"></p>
                  </div>
                </div>
                <div class="profile-info-item">
                  <span class="profile-info-item__icon"><i class="ph ph-at"></i></span>
                  <div>
                    <p class="profile-info-item__label">Nombre de usuario</p>
                    <p class="profile-info-item__value" th:text="${usuario.usuario}"></p>
                  </div>
                </div>
                <div class="profile-info-item">
                  <span class="profile-info-item__icon"><i class="ph ph-envelope"></i></span>
                  <div>
                    <p class="profile-info-item__label">Correo electr�nico</p>
                    <p class="profile-info-item__value" th:text="${usuario.email}"></p>
                  </div>
                </div>
                <div class="profile-info-item">
                  <span class="profile-info-item__icon"><i class="ph ph-phone"></i></span>
                  <div>
                    <p class="profile-info-item__label">Tel�fono</p>
                    <p class="profile-info-item__value" th:text="${usuario.telefono}"></p>
                  </div>
                </div>
              </div>
            </section>

            <section class="detail-section">
              <h2 class="detail-section__title">Cuenta</h2>
              <div class="profile-info-grid">
                <div class="profile-info-item">
                  <span class="profile-info-item__icon"><i class="ph ph-shield-check"></i></span>
                  <div>
                    <p class="profile-info-item__label">Rol</p>
                    <p class="profile-info-item__value" th:text="${usuario.rol}"></p>
                  </div>
                </div>
                <div class="profile-info-item">
                  <span class="profile-info-item__icon"><i class="ph ph-hash"></i></span>
                  <div>
                    <p class="profile-info-item__label">ID de usuario</p>
                    <p class="profile-info-item__value" th:text="${usuario.id}"></p>
                  </div>
                </div>
              </div>
            </section>

          </div>
        </div>

      </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>

    <script src="/js/script.js"></script>
  </body>
</html>
