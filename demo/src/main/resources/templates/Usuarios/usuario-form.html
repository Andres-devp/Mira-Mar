<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title
      th:text="${usuario.id} != null ? 'Editar Usuario' : 'Nuevo Usuario'"
    ></title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/formularios.css" />
  </head>
  <body class="page-services">
    <div th:replace="fragments/navbar :: navbar"></div>

    <main class="form-page">
      <div class="container">
        <div class="form-shell">
          <h1
            class="form-shell__title"
            th:text="${usuario.id} != null ? 'Editar Usuario' : 'Nuevo Usuario'"
          ></h1>

          <form
            th:action="${usuario.id} != null ? @{'/usuarios/edit/' + ${usuario.id}} : @{/usuarios/add}"
            th:object="${usuario}"
            method="post"
          >
            <div class="form-grid">
              <div class="form-field">
                <label for="nombre">Nombre *</label>
                <input
                  type="text"
                  id="nombre"
                  name="nombre"
                  th:field="*{nombre}"
                  required
                />
                <div class="form-error"></div>
              </div>

              <div class="form-field">
                <label for="usuario">Usuario *</label>
                <input
                  type="text"
                  id="usuario"
                  name="usuario"
                  th:field="*{usuario}"
                  required
                />
                <div class="form-error"></div>
              </div>

              <div class="form-field">
                <label for="contrasena">Contraseña *</label>
                <input
                  type="password"
                  id="contrasena"
                  name="contrasena"
                  th:field="*{contrasena}"
                  required
                />
                <div class="form-error"></div>
              </div>

              <div class="form-field">
                <label for="email">Email</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  th:field="*{email}"
                />
                <div class="form-error"></div>
              </div>

              <div class="form-field">
                <label for="telefono">Teléfono</label>
                <input
                  type="text"
                  id="telefono"
                  name="telefono"
                  th:field="*{telefono}"
                />
                <div class="form-error"></div>
              </div>

              <div class="form-field">
                <label for="rol">Rol *</label>
                <select id="rol" name="rol" th:field="*{rol}" required>
                  <option value="">Selecciona un rol</option>
                  <option value="admin">Admin</option>
                  <option value="cliente">Cliente</option>
                </select>
                <div class="form-error"></div>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn--primary">
                <span
                  th:text="${usuario.id} != null ? 'Guardar cambios' : 'Crear usuario'"
                ></span>
              </button>
              <a href="/usuarios" class="btn btn--ghost">Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>

    <script src="/js/script.js"></script>
  </body>
</html>
