<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detalle Tipo de Habitación | Mira Mar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/detalle.css" />
  </head>
  <body class="detail-page">
    <div th:replace="fragments/navbar :: navbar"></div>

    <header class="detail-hero">
      <div class="container">
        <div class="detail-hero__grid">
          <div>
            <h1 class="detail-hero__title">Detalle del tipo</h1>
            <p class="detail-hero__lead">Información del tipo de habitación</p>

            <div class="detail-hero__actions">
              <a href="/roomtypes" class="btn btn--ghost">← Volver</a>
              <a
                th:href="@{'/roomtypes/edit/' + ${type.code}}"
                class="btn btn--ghost"
                >Editar</a
              >
              <form
                th:action="@{'/roomtypes/delete/' + ${type.code}}"
                method="post"
                style="display: inline"
              >
                <button
                  type="submit"
                  class="btn btn--secondary"
                  onclick="
                    return confirm('¿Seguro que deseas eliminar este tipo?');
                  "
                >
                  Eliminar
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="detail-main">
      <div class="container">
        <section class="detail-section">
          <p><strong>Código:</strong> <span th:text="${type.code}"></span></p>
          <p>
            <strong>Nombre:</strong> <span th:text="${type.displayName}"></span>
          </p>
          <p>
            <strong>Descripción:</strong>
            <span th:text="${type.description}"></span>
          </p>
        </section>
      </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>

    <script src="/js/script.js"></script>
  </body>
</html>
