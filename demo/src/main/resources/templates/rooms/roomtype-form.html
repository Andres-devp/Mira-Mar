<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title
      th:text="${tipo.id} != null ? 'Editar Tipo | Mira Mar' : 'Nuevo Tipo | Mira Mar'"
    ></title>
    <link rel="icon" type="image/png" href="/images/Mira Mar logo Blanco.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/rooms/roomtype-form.css" />
  </head>
  <body class="page-services">
    <div th:replace="fragments/navbar :: navbar"></div>

    <main class="form-page">
      <div class="container">
        <div class="form-shell">
          <h1
            class="form-shell__title"
            th:text="${tipo.id} != null ? 'Editar Tipo' : 'Nuevo Tipo'"
          ></h1>

          <form
            th:action="${tipo.id} != null ? @{'/roomtypes/edit/' + ${tipo.id}} : @{/roomtypes/add}"
            th:object="${tipo}"
            method="post"
          >
            <div class="form-grid">
              <div class="form-field">
                <label for="codigo">Código *</label>
                <input
                  type="text"
                  id="codigo"
                  name="codigo"
                  th:field="*{codigo}"
                  th:readonly="${tipo.id} != null"
                  required
                />
                <div class="form-error"></div>
              </div>

              <div class="form-field">
                <label for="nombre">Nombre *</label>
                <input
                  type="text"
                  id="nombre"
                  name="nombre"
                  th:field="*{nombre}"
                  required
                />
                <div class="form-error"></div>
              </div>

              <div class="form-field form-field--full">
                <label for="descripcion">Descripción</label>
                <textarea
                  id="descripcion"
                  name="descripcion"
                  th:field="*{descripcion}"
                ></textarea>
                <div class="form-error"></div>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn--primary">
                <span
                  th:text="${tipo.id} != null ? 'Guardar cambios' : 'Crear tipo'"
                ></span>
              </button>
              <a href="/roomtypes" class="btn btn--ghost">Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>

    <script src="/js/script.js"></script>
  </body>
</html>
