<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${room.name} + ' | Mira Mar Caribbean Luxury'">Detalle de Habitación</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/detalle.css" />
  </head>
  <body class="detail-page">
    <div th:replace="fragments/navbar :: navbar"></div>

    <header class="detail-hero">
      <div class="container">
        <div class="detail-hero__grid">
          <div>
            <h1 class="detail-hero__title" th:text="${room.name}">Nombre de Habitación</h1>
            <p class="detail-hero__lead" th:text="${room.description}">Descripción breve de la habitación</p>

            <div class="detail-hero__actions">
              <a href="/rooms" class="btn btn--ghost">← Volver</a>
              <a th:href="@{'/rooms/' + ${room.id} + '/edit'}" class="btn btn--ghost">Editar</a>
              <form th:action="@{'/rooms/' + ${room.id} + '/delete'}" method="POST" style="display: inline;">
                <button type="submit" class="btn btn--secondary" onclick="return confirm('¿Confirma que desea eliminar esta habitación?')">
                  Eliminar
                </button>
              </form>
            </div>
          </div>

          <aside class="price-card" aria-label="Precio por noche">
            <div class="price-card__label">Precio por noche</div>
            <div class="price-card__value" th:text="'$' + ${room.pricePerNight}">$0</div>
          </aside>
        </div>
      </div>
    </header>

    <main class="detail-main">
      <div class="container">
        <div class="detail-layout">
          <div>
            <figure class="detail-figure">
              <img
                th:src="${room.imageUrl}"
                th:alt="${room.name}"
                onerror="this.src='https://via.placeholder.com/900x480/cdc392/ffffff?text=Habitacion'"
              />
            </figure>

            <section class="detail-section">
              <h2 class="detail-section__title">Descripción detallada</h2>
              <p th:text="${room.description}">Descripción completa de la habitación.</p>
            </section>

            <section class="detail-section">
              <h2 class="detail-section__title">Características</h2>
              <div class="card__meta">
                <span th:text="${room.capacity} + ' huéspedes'">0 huéspedes</span>
                <span th:text="${roomTypeDisplayNames[room.roomType] != null ? roomTypeDisplayNames[room.roomType] : room.roomType}">Tipo</span>
              </div>
            </section>
          </div>

          <aside class="detail-aside">
            <div class="detail-aside__panel">
              <h3>Reservar ahora</h3>

              <div class="form-field">
                <label for="checkin">Fecha de llegada</label>
                <input type="date" id="checkin" />
              </div>

              <div class="form-field">
                <label for="checkout">Fecha de salida</label>
                <input type="date" id="checkout" />
              </div>

              <div class="form-field">
                <label for="guests">Huéspedes</label>
                <select id="guests">
                  <option
                    th:each="i : ${#numbers.sequence(1, room.capacity)}"
                    th:text="${i} + ' huésped' + (${i} > 1 ? 'es' : '')"
                    th:value="${i}"
                  >
                    1 huésped
                  </option>
                </select>
              </div>

              <div style="display: grid; gap: 0.75rem; margin-top: 1.25rem;">
                <button class="btn btn--primary" type="button">Reservar ahora</button>
                <a href="/rooms" class="btn btn--ghost">Ver otras suites</a>
              </div>
            </div>
          </aside>
        </div>
      </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>

    <script src="/js/script.js"></script>
  </body>
</html>
