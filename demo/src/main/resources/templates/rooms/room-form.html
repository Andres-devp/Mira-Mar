<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title
      th:text="${isNew} ? 'Nueva Habitación | Mira Mar' : 'Editar Habitación | Mira Mar'"
    ></title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/rooms/room-form.css" />
  </head>
  <body class="page-rooms">
    <div th:replace="fragments/navbar :: navbar"></div>

    <main class="form-page">
      <div class="container">
        <div class="form-shell">
          <h1
            class="form-shell__title"
            th:text="${isNew} ? 'Nueva Habitación' : 'Editar Habitación'"
          ></h1>

          <form
            th:action="${isNew} ? '/rooms' : '/rooms/' + ${room.id}"
            method="POST"
          >
            <div class="form-grid">
              <div class="form-field">
                <label for="name">Nombre de la habitación *</label>
                <input
                  type="text"
                  id="name"
                  name="name"
                  th:value="${room.name}"
                  required
                />
                <div class="form-error"></div>
              </div>

              <div class="form-field">
                <label for="roomType">Tipo de habitación *</label>
                <select id="roomType" name="roomType" required>
                  <option value="">-- Seleccionar --</option>
                  <option
                    th:each="rt : ${roomTypes}"
                    th:value="${rt.code}"
                    th:text="${rt.displayName}"
                    th:selected="${room.roomType == rt.code}"
                  ></option>
                </select>
                <div class="form-error"></div>
              </div>

              <div class="form-field">
                <label for="capacity">Capacidad (huéspedes) *</label>
                <input
                  type="number"
                  id="capacity"
                  name="capacity"
                  th:value="${room.capacity}"
                  min="1"
                  max="10"
                  required
                />
                <div class="form-error"></div>
              </div>

              <div class="form-field">
                <label for="pricePerNight">Precio por noche ($) *</label>
                <input
                  type="number"
                  id="pricePerNight"
                  name="pricePerNight"
                  th:value="${room.pricePerNight}"
                  min="0"
                  step="0.01"
                  required
                />
                <div class="form-error"></div>
              </div>

              <div class="form-field form-field--full">
                <label for="imageUrl">URL de imagen</label>
                <input
                  type="url"
                  id="imageUrl"
                  name="imageUrl"
                  th:value="${room.imageUrl}"
                  placeholder="https://ejemplo.com/imagen.jpg"
                />
                <div class="form-error"></div>
              </div>

              <div class="form-field form-field--full">
                <label for="description">Descripción *</label>
                <textarea
                  id="description"
                  name="description"
                  required
                  th:text="${room.description}"
                ></textarea>
                <div class="form-error"></div>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn--primary">
                <span
                  th:text="${isNew} ? 'Crear habitación' : 'Guardar cambios'"
                ></span>
              </button>
              <a href="/rooms" class="btn btn--ghost">Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>

    <script src="/js/script.js"></script>
  </body>
</html>
