<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reservas (Tabla) | Mira Mar</title>
    <link rel="icon" type="image/png" href="/images/Mira Mar logo Blanco.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/rooms/roomtype-tabla.css" />
  </head>
  <body class="page-services">
    <div th:replace="fragments/navbar :: navbar"></div>

    <main class="services-page">
      <div class="container">
        <section class="services-page__sectionHeader">
          <div>
            <h2>Reservas (Tabla)</h2>
            <p>Vista administrativa de reservas del hotel.</p>
          </div>
          <div class="services-page__sectionActions">
            <a href="/admin" class="btn btn--ghost">Volver</a>
          </div>
        </section>

        <table class="services-table" th:if="${not #lists.isEmpty(reservas)}">
          <thead>
            <tr>
              <th>ID</th>
              <th>Cliente</th>
              <th>Habitación</th>
              <th>Fecha inicio</th>
              <th>Fecha fin</th>
              <th>Personas</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="reserva : ${reservas}">
              <td th:text="${reserva.id}"></td>
              <td th:text="${reserva.client != null ? reserva.client.nombre : 'N/A'}"></td>
              <td th:text="${reserva.room != null ? reserva.room.nombre : 'N/A'}"></td>
              <td th:text="${reserva.fechaInicio}"></td>
              <td th:text="${reserva.fechaFin}"></td>
              <td th:text="${reserva.cantidadPersonas}"></td>
              <td th:text="${reserva.estado}"></td>
            </tr>
          </tbody>
        </table>

        <section
          th:if="${#lists.isEmpty(reservas)}"
          class="services-page__empty"
          aria-live="polite"
        >
          <h2>No hay reservas registradas</h2>
          <p>Cuando existan reservas, se mostrarán aquí.</p>
        </section>
      </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>

    <script src="/js/script.js"></script>
  </body>
</html>
