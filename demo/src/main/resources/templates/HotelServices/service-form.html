<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agregar/Editar Servicio | Mira Mar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/formularios.css" />
  </head>
  <body class="page-services">
    
    <div th:replace="fragments/navbar :: navbar"></div>

    <main class="form-page">
      <div class="container">
        <div class="form-shell">
          <h1 class="form-shell__title" th:text="${servicio.id} != null ? 'Editar Servicio' : 'Nuevo Servicio'"></h1>

          <form
            th:action="${servicio.id} != null ? @{'/services/edit/' + ${servicio.id}} : @{/services/add}"
            th:object="${servicio}"
            method="post"
          >
            <div class="form-grid">
              <div class="form-field">
                <label for="nombre">Nombre del servicio *</label>
                <input type="text" id="nombre" name="nombre" th:field="*{nombre}" required />
                <div class="form-error"></div>
              </div>

              <div class="form-field">
                <label for="imageUrl">URL de imagen</label>
                <input type="url" id="imageUrl" name="imageUrl" th:field="*{imageUrl}" />
                <div class="form-error"></div>
              </div>

              <div class="form-field">
                <label for="price">Precio (USD)</label>
                <input type="number" id="price" name="price" th:field="*{price}" step="0.01" min="0" />
                <div class="form-error"></div>
              </div>

              <div class="form-field form-field--full">
                <label for="descripcion">Descripción *</label>
                <textarea id="descripcion" name="descripcion" th:field="*{descripcion}" required></textarea>
                <div class="form-error"></div>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn--primary">
                <span th:text="${servicio.id} != null ? 'Guardar cambios' : 'Crear servicio'"></span>
              </button>
              <a href="/services/cards" class="btn btn--ghost">Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </main>

<div th:replace="fragments/footer :: footer"></div>

    <script src="/js/script.js"></script>
  </body>
</html>
