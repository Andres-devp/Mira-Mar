<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Servicios | Mira Mar Caribbean Luxury</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/habitaciones.css" />
  </head>
  <body class="page-rooms-list">
    <div th:replace="fragments/navbar :: navbar"></div>

    <main class="services-page">
      <div class="container">
        <header class="rooms-list__header">
          <h1>Nuestros Servicios</h1>
          <p>
            Comodidades y experiencias diseñadas para elevar tu estadía frente
            al mar.
          </p>

          <div class="services-page__actions">
            <a href="/services/add" class="btn btn--primary">
              <i class="ph ph-plus"></i> Nuevo servicio
            </a>
            <a href="/services/table" class="btn btn--ghost"
              >Vista administrativa</a
            >
          </div>
        </header>

        <section
          class="cards-grid"
          th:if="${not #lists.isEmpty(servicios)}"
          aria-label="Listado de servicios"
        >
          <article class="card card--room" th:each="servicio : ${servicios}">
            <div class="card__media">
              <img th:src="${servicio.imageUrl}" th:alt="${servicio.nombre}" />
              <div
                class="room-price-badge"
                th:text="${servicio.price != null ? '$' + servicio.price : 'Consultar'}"
              >
                $0
              </div>
            </div>

            <div class="card__body">
              <h2 class="card__title" th:text="${servicio.nombre}">Nombre</h2>
              <p class="card__subtitle" th:text="${servicio.descripcion}">
                Descripción del servicio
              </p>

              <div class="card__meta">
                <span><i class="ph ph-star"></i> Servicio</span>
              </div>

              <div class="card__actions">
                <a
                  th:href="@{'/services/' + ${servicio.id}}"
                  class="btn btn--ghost"
                  >Descubrir</a
                >
              </div>
            </div>
          </article>
        </section>

        <section
          th:if="${#lists.isEmpty(servicios)}"
          class="services-page__empty"
          aria-live="polite"
        >
          <h2>No hay servicios disponibles</h2>
          <p>Agrega un servicio para que aparezca en esta sección.</p>
        </section>
      </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>

    <script src="/js/script.js"></script>
  </body>
</html>
