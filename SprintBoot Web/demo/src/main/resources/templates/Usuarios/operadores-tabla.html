<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Operadores (Tabla) | Mira Mar</title>
    <link rel="icon" type="image/png" href="/images/Mira Mar logo Blanco.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/Usuarios/usuarios-tabla.css" />
  </head>
  <body class="page-services">
    <div th:replace="fragments/navbar :: navbar"></div>

    <main class="services-page">
      <div class="container">
        <section class="services-page__sectionHeader">
          <div>
            <h2>Operadores (Tabla)</h2>
            <p>Vista administrativa de operadores.</p>
          </div>
          <div class="services-page__sectionActions">
            <a href="/admin" class="btn btn--ghost">Volver</a>
          </div>
        </section>

        <table class="services-table" th:if="${not #lists.isEmpty(operadores)}">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Apellido</th>
              <th>Usuario</th>
              <th>Email</th>
              <th>Cédula</th>
              <th>Teléfono</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="operador : ${operadores}">
              <td th:text="${operador.id}"></td>
              <td th:text="${operador.nombre}"></td>
              <td th:text="${operador.apellido}"></td>
              <td th:text="${operador.usuario}"></td>
              <td th:text="${operador.email}"></td>
              <td th:text="${operador.cedula}"></td>
              <td th:text="${operador.telefono}"></td>
            </tr>
          </tbody>
        </table>

        <section
          th:if="${#lists.isEmpty(operadores)}"
          class="services-page__empty"
          aria-live="polite"
        >
          <h2>No hay operadores registrados</h2>
          <p>Cuando existan operadores, se mostrarán aquí.</p>
        </section>
      </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>

    <script src="/js/script.js"></script>
  </body>
</html>
