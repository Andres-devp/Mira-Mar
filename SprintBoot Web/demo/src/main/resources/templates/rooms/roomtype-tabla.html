<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tipos de habitación (Tabla) | Mira Mar</title>
    <link rel="icon" type="image/png" href="/images/Mira Mar logo Blanco.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/rooms/roomtype-tabla.css" />
  </head>
  <body class="page-services">
    <div th:replace="fragments/navbar :: navbar"></div>

    <main class="services-page">
      <div class="container">
        <section class="services-page__sectionHeader">
          <div>
            <h2>Tipos de habitación (Tabla)</h2>
            <p>Gestiona los distintos tipos que puede tener una habitación.</p>
          </div>
          <div class="services-page__sectionActions">
            <a href="/admin" class="btn btn--ghost">Volver</a>
            <a href="/rooms/table" class="btn btn--ghost">Habitaciones (tabla)</a>
            <a href="/roomtypes/add" class="btn btn--primary">Crear tipo</a>
          </div>
        </section>

        <p th:if="${warning}" th:text="${warning}"></p>

        <table class="services-table" th:if="${not #lists.isEmpty(tiposHabitacion)}">
          <thead>
            <tr>
              <th>Código</th>
              <th>Nombre</th>
              <th>Descripción</th>
              <th>Precio/noche</th>
              <th>Capacidad</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="type : ${tiposHabitacion}">
              <td th:text="${type.codigo}"></td>
              <td th:text="${type.nombre}"></td>
              <td th:text="${type.descripcion}"></td>
              <td th:text="'$' + ${type.precioNoche}"></td>
              <td th:text="${type.capacidad}"></td>
              <td>
                <div class="icon-actions">
                  <a th:href="@{'/roomtypes/edit/' + ${type.id}}" class="icon-action" title="Editar">
                    <i class="ph ph-pencil-simple"></i>
                  </a>
                  <form th:action="@{'/roomtypes/delete/' + ${type.id}}" method="post">
                    <button
                      type="submit"
                      class="icon-action icon-action--danger"
                      title="Eliminar"
                      onclick="
                        return confirm(
                          '¿Seguro que deseas eliminar este tipo?',
                        );
                      "
                    >
                      <i class="ph ph-trash"></i>
                    </button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>

        <section
          th:if="${#lists.isEmpty(tiposHabitacion)}"
          class="services-page__empty"
          aria-live="polite"
        >
          <h2>No hay tipos definidos</h2>
          <p>Añade un tipo para verlo aquí.</p>
        </section>
      </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>

    <script src="/js/script.js"></script>
  </body>
</html>
