#---
spring.config.activate.on-profile=default

spring.application.name=demo
server.port=8080

#datasource
spring.jpa.database=h2
spring.datasource.driver-class-name=org.h2.Driver
#nombre base de datos
spring.datasource.url=jdbc:h2:file:./mydatabase
spring.datasource.username=sa
spring.datasource.password=

#consola de administracion de h2
spring.h2.console.enabled=true
#localhost:8080/h2
spring.h2.console.path=/h2

# Datos de prueba
spring.jpa.generate-ddl=true
#borrar la tabla cada vez
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=always

# Logging
#permite imprimir la query
logging.level.org.hibernate.SQL=DEBUG
#imrime los parametros de las querys
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.properties.hibernate.format_sql=true



jwt.secret=miramar-hotel-jwt-secret-key-2024-super-secure-key-change-in-production
jwt.expiration=86400000
jwt.refresh-expiration=604800000

#---
spring.config.activate.on-profile=test

spring.application.name=demo
server.port=8080

#datasource
spring.jpa.database=h2
spring.datasource.driver-class-name=org.h2.Driver
#nombre base de datos
spring.datasource.url=jdbc:h2:file:./testdb
spring.datasource.username=sa
spring.datasource.password=

#consola de administracion de h2
spring.h2.console.enabled=true
#localhost:8080/h2
spring.h2.console.path=/h2

# Datos de prueba
spring.jpa.generate-ddl=true
#borrar la tabla cada vez
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never

# Logging
#permite imprimir la query
logging.level.org.hibernate.SQL=DEBUG
#imrime los parametros de las querys
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.properties.hibernate.format_sql=true

