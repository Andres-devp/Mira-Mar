<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suites (Tabla) | Mira Mar</title>
    <link rel="icon" type="image/png" href="/images/Mira Mar logo Blanco.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/rooms/rooms-table.css" />
  </head>
  <body class="page-rooms-list">
    <div th:replace="fragments/navbar :: navbar"></div>

    <main class="rooms-list">
      <div class="container">
        <section class="rooms-list__sectionHeader">
          <div>
            <h2>Suites (Tabla)</h2>
            <p>Vista administrativa/rápida.</p>
          </div>
          <div class="rooms-list__sectionActions">
            <a href="/admin" class="btn btn--ghost">Volver</a>
            <a href="/rooms" class="btn btn--ghost">Ver tarjetas</a>
            <a href="/roomtypes" class="btn btn--ghost">Tipos de habitaciones</a>
            <a href="/rooms/add" class="btn btn--primary">Crear habitación</a>
          </div>
        </section>

        <table class="rooms-table" th:if="${not #lists.isEmpty(rooms)}">
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Tipo</th>
              <th>Capacidad</th>
              <th>Precio</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="room : ${rooms}">
              <td th:text="${room.id}"></td>
              <td th:text="${room.nombre}"></td>
              <td th:text="${room.tipoHabitacion.nombre != null ? room.tipoHabitacion.nombre : 'N/A'}"></td>
              <td th:text="${room.tipoHabitacion.capacidad}"></td>
              <td th:text="'$' + ${room.tipoHabitacion.precioNoche}"></td>
              <td>
                <div class="icon-actions">
                  <a th:href="@{'/rooms/' + ${room.id} + '/edit'}" class="icon-action" title="Editar">
                    <i class="ph ph-pencil-simple"></i>
                  </a>
                  <form th:action="@{'/rooms/' + ${room.id} + '/delete'}" method="POST">
                    <button
                      type="submit"
                      class="icon-action icon-action--danger"
                      title="Eliminar"
                      onclick="
                        return confirm(
                          '¿Confirma que desea eliminar esta habitación?',
                        );
                      "
                    >
                      <i class="ph ph-trash"></i>
                    </button>
                  </form>
                </div>
              </td>
            </tr>
          </tbody>
        </table>

        <section
          th:if="${#lists.isEmpty(rooms)}"
          class="rooms-list__empty"
          aria-live="polite"
        >
          <h2>No hay habitaciones disponibles</h2>
          <p>En este momento no contamos con habitaciones disponibles.</p>
        </section>
      </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>

    <script src="/js/script.js"></script>
  </body>
</html>
