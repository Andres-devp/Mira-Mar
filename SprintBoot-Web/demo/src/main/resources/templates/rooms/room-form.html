<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title
      th:text="${isNew} ? 'Nueva Habitación | Mira Mar' : 'Editar Habitación | Mira Mar'"
    ></title>
    <link rel="icon" type="image/png" href="/images/Mira Mar logo Blanco.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/rooms/room-form.css" />
  </head>
  <body class="page-rooms">
    <div th:replace="fragments/navbar :: navbar"></div>

    <main class="form-page">
      <div class="container">
        <div class="form-shell">
          <h1
            class="form-shell__title"
            th:text="${isNew} ? 'Nueva Habitación' : 'Editar Habitación'"
          ></h1>

          <form
            th:action="${isNew} ? '/rooms' : '/rooms/' + ${room.id}"
            method="POST"
          >
            <div class="form-grid">
              <div class="form-field">
                <label for="nombre">Nombre de la habitación *</label>
                <input
                  type="text"
                  id="nombre"
                  name="nombre"
                  th:value="${room.nombre}"
                  required
                />
                <div class="form-error"></div>
              </div>

              <div class="form-field">
                <label for="tipoHabitacion">Tipo de habitación *</label>
                <select id="tipoHabitacion" name="tipoHabitacion.id" required>
                  <option value="">-- Seleccionar --</option>
                  <option
                    th:each="rt : ${roomTypes}"
                    th:value="${rt.id}"
                    th:text="${rt.nombre}"
                    th:selected="${room.tipoHabitacion != null && room.tipoHabitacion.id == rt.id}"
                  ></option>
                </select>
                <div class="form-error"></div>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn--primary">
                <span
                  th:text="${isNew} ? 'Crear habitación' : 'Guardar cambios'"
                ></span>
              </button>
              <a href="/rooms" class="btn btn--ghost">Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>

    <script src="/js/script.js"></script>
  </body>
</html>
