<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil de Usuario | Mira Mar</title>
    <link rel="icon" type="image/png" href="/images/Mira Mar logo Blanco.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="/css/styles.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/Usuarios/usuario-detail.css" />
  </head>
  <body class="detail-page">

    <div th:replace="fragments/navbar :: navbar"></div>

    <header class="detail-hero">
      <div class="container">
        <div class="detail-hero__grid">
          <div>
            <h1 class="detail-hero__title" th:text="${usuario.nombre}">Nombre</h1>
            <p class="detail-hero__lead">
              <i class="ph ph-user-circle"></i>
              <span th:text="${usuario.usuario}">@usuario</span>
            </p>
            <div class="detail-hero__actions">
              <a href="/usuarios" class="btn btn--ghost">&larr; Volver</a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="detail-main">
      <div class="container">

        <div class="profile-layout">

          <!-- Left: Avatar + quick info -->
          <aside class="profile-sidebar">
            <div class="profile-sidebar__top-actions">
              <details th:if="${mostrarEditarPerfil} or ${mostrarEliminarCuenta}" class="profile-actions-menu profile-actions-menu--card">
                <summary class="profile-actions-menu__trigger" aria-label="Acciones de cuenta">
                  <i class="ph ph-dots-three-outline-vertical"></i>
                </summary>
                <div class="profile-actions-menu__panel">
                  <a th:href="@{'/usuarios/' + ${usuario.id}}" class="profile-actions-menu__item">
                    <i class="ph ph-eye"></i> Ver perfil
                  </a>
                  <a th:if="${mostrarEditarPerfil}" th:href="@{'/usuarios/edit/' + ${usuario.id}}" class="profile-actions-menu__item">
                    <i class="ph ph-pencil-simple"></i> Editar perfil
                  </a>
                  <form th:if="${mostrarEliminarCuenta}" th:action="@{/usuarios/delete-account}" method="post" class="profile-actions-menu__form">
                    <button type="submit" class="profile-actions-menu__item profile-actions-menu__item--danger"
                            onclick="return confirm('Seguro que deseas eliminar tu cuenta? Esta accion no se puede deshacer.')">
                      <i class="ph ph-trash"></i> Eliminar cuenta
                    </button>
                  </form>
                </div>
              </details>
            </div>
            <div class="profile-avatar-wrap">
              <div class="profile-avatar">
                <i class="ph ph-user"></i>
              </div>
            </div>
            <div class="profile-sidebar__info">
              <p class="profile-sidebar__name" th:text="${usuario.nombre}"></p>
              <p class="profile-sidebar__username" th:text="'@' + ${usuario.usuario}"></p>
            </div>
          </aside>

          <!-- Right: Detail sections -->
          <div class="profile-content">

            <section class="detail-section">
              <h2 class="detail-section__title">Informacion personal</h2>
              <div class="profile-info-grid">
                <div class="profile-info-item">
                  <span class="profile-info-item__icon"><i class="ph ph-identification-card"></i></span>
                  <div>
                    <p class="profile-info-item__label">Nombre completo</p>
                    <p class="profile-info-item__value" th:text="${usuario.nombre}"></p>
                  </div>
                </div>
                <div class="profile-info-item">
                  <span class="profile-info-item__icon"><i class="ph ph-at"></i></span>
                  <div>
                    <p class="profile-info-item__label">Nombre de usuario</p>
                    <p class="profile-info-item__value" th:text="${usuario.usuario}"></p>
                  </div>
                </div>
                <div class="profile-info-item">
                  <span class="profile-info-item__icon"><i class="ph ph-envelope"></i></span>
                  <div>
                    <p class="profile-info-item__label">Correo electronico</p>
                    <p class="profile-info-item__value" th:text="${usuario.email}"></p>
                  </div>
                </div>
                <div class="profile-info-item">
                  <span class="profile-info-item__icon"><i class="ph ph-phone"></i></span>
                  <div>
                    <p class="profile-info-item__label">Telofono</p>
                    <p class="profile-info-item__value" th:text="${usuario.telefono}"></p>
                  </div>
                </div>
              </div>
            </section>

          </div>
        </div>

      </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>

    <script src="/js/script.js"></script>
  </body>
</html>
